[project]
name = "attendance-management-backend"
version = "0.1.0"
description = "Open-source Python backend for attendance management"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.37",
  "pydantic-settings==2.7.1",
  "psycopg[binary]==3.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
